name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Install Metal compiler
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Check and test native application
        run: |
          cargo check --locked --manifest-path app/Cargo.toml
          cargo test --locked --manifest-path app/Cargo.toml
      - name: Build native app and DMG
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: python3 scripts/bundle_macos.py --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: app/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Check and test native application
        run: |
          cargo check --locked --manifest-path app/Cargo.toml
          cargo test --locked --manifest-path app/Cargo.toml
      - name: Build native installer
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Attach artifacts to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --draft --title "Everything $RELEASE_TAG" --notes-file .github/release-notes.md
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
