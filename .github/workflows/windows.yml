name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [gpui-ui]
    paths:
      - '.github/workflows/windows.yml'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'scripts/build-windows.ps1'
      - 'src-tauri/**'

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-gpui-release
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Run Rust regression tests
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows executable and installer
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: everything-windows-x64
          path: |
            src-tauri/target/release/everything.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
