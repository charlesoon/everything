[package]
name = "everything"
version = "0.6.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-channel = "2"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
global-hotkey = "0.7"
raw-window-handle = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
parking_lot = "0.12"
rusqlite = { version = "0.40", features = ["bundled", "chrono", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.22"
trash = "5"
jwalk = "0.8"
walkdir = "2"
ignore = "0.4.25"
fs2 = "0.4"
# Timestamps for the post-mortem diag log (already in-tree via rusqlite's
# "chrono" feature, so this adds no new transitive dependency).
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
fsevent-sys = "4"
muda = { version = "=0.17.1", default-features = false }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
cocoa = { version = "0.26", optional = true }
objc = { version = "0.2", optional = true }
dispatch = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = "2.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_EventLog",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }
windows-service = "0.7"
notify = "7"
rayon = "1"
png = "0.17"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[features]
ui-automation = ["dep:cocoa", "dep:objc"]
